services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ozon
      POSTGRES_PASSWORD: ozon
      POSTGRES_DB: ozon
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ozon -d ozon"]
      interval: 2s
      timeout: 3s
      retries: 20
  app:
    build:
      context: .
      args:
        GO_IMAGE: ${GO_IMAGE:-golang:1.25-alpine}
    command: ["-storage=postgres", "-addr=:8080"]
    environment:
      DATABASE_URL: postgres://ozon:ozon@db:5432/ozon?sslmode=disable
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
