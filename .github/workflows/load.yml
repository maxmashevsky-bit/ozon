name: Extended load
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true
      - run: make load-full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-results
          path: |
            .artifacts/ozon-load-*/metadata.json
            .artifacts/ozon-load-*/results.json
            .artifacts/ozon-load-*/query-plans.txt
            .artifacts/ozon-load-*/**/result.json
            .artifacts/ozon-load-*/**/resources.json
            .artifacts/ozon-load-*/**/sql.json
            .artifacts/ozon-load-*/containers.log
          include-hidden-files: true
